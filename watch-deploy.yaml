apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-scheduler-watch
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-scheduler-watch
  template:
    metadata:
      labels:
        app: my-scheduler-watch
    spec:
      serviceAccountName: my-scheduler
      containers:
        - name: scheduler
          image: my-py-scheduler:latest
          imagePullPolicy: IfNotPresent
          args: ["python", "scheduler_watch.py", "--scheduler-name", "my-scheduler"]
